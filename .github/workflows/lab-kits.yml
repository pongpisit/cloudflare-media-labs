name: Publish browser lab kits
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update, for example labs-2026-10-28
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^labs-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[A-Za-z0-9.]+)?$ ]] || { echo "Use a tag such as labs-2026-10-28 or labs-2026-10-28-v2."; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:browser
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - run: npm run package:labs
      - name: Verify checksums
        run: cd downloads && sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: browser-lab-kits
          path: downloads/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: browser-lab-kits
          path: downloads
      - name: Verify checksums
        run: cd downloads && sha256sum -c SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          NOTES="Extract a ZIP, open START-HERE.html, then follow the lab. Do not enter API tokens or secret keys. Verify downloads with SHA256SUMS.txt. Built from commit $GITHUB_SHA."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; choose a new tag instead of replacing published assets."
            exit 1
          fi
          gh release create "$TAG" downloads/* --target "$GITHUB_SHA" --title "Browser lab kits $TAG" --notes "$NOTES"
