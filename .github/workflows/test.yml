name: Local lab checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
  windows-docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 syntax and offline lab checks
        shell: powershell
        run: ./tests/windows-docs.ps1
      - name: PowerShell 7 syntax and offline lab checks
        shell: pwsh
        run: ./tests/windows-docs.ps1
